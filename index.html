<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicInvest — Инвестируй в музыку будущего</title>
    <meta name="description" content="Музыкальный стриминговый сервис с краудфандингом. Поддерживай артистов, получай долю от выручки." />
    <meta name="theme-color" content="#f8f9fa" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem("theme");
          const isDark = theme === "dark";
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute("content", "#0a0a0f");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
